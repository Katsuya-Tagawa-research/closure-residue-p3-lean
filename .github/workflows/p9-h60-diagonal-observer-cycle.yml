    branches:
      - research/p9-h60-diagonal-observer-k4-cycle-ambiguity-20261015
  pull_request:

permissions:
  contents: read

jobs:
  h60-population-k4-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exact diagonal population rank, K4 cycle kernel, metric ambiguity and X/Y tangent reconstruction
