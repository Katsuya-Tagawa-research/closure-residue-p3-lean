name: P3 Rational Unitary Channel CI

on:
  push:
    branches:
      - research/p3-rational-unitary-cptp-20261013
  pull_request:

permissions:
  contents: read

jobs:
  rational-unitary-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile rational unitary quantum channel
        run: lake build P3.RationalUnitaryChannel
      - name: Audit unitary and trace-preservation proofs
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/RationalUnitaryChannelAxiomAudit.lean | tee rational_unitary_axioms.log
          if grep -q 'sorryAx' rational_unitary_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
