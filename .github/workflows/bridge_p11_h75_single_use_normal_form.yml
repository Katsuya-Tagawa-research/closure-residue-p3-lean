name: Bridge P11 H75 Single-Use Normal Form and Rank-Nine Exact Audit

on:
  push:
    paths:
      - 'research/bridge/p11-single-use-normal-form-20261020/**'
      - '.github/workflows/bridge_p11_h75_single_use_normal_form.yml'
  pull_request:
    paths:
      - 'research/bridge/p11-single-use-normal-form-20261020/**'
      - '.github/workflows/bridge_p11_h75_single_use_normal_form.yml'
  workflow_dispatch:

jobs:
  h75-single-use-normal-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy
      - name: Verify original H75 rank-nine and AX-OA behavioral normal form
        run: python research/bridge/p11-single-use-normal-form-20261020/H75_Single_Use_Normal_Form_Rank_Nine_Exact.py
