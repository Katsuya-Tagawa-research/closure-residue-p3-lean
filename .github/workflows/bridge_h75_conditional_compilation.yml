name: Bridge H75 AX-OA Conditional Compilation Exact Audit

on:
  push:
    paths:
      - 'research/bridge/h75-conditional-compilation-20261020/**'
      - '.github/workflows/bridge_h75_conditional_compilation.yml'
  pull_request:
    paths:
      - 'research/bridge/h75-conditional-compilation-20261020/**'
      - '.github/workflows/bridge_h75_conditional_compilation.yml'
  workflow_dispatch:

jobs:
  control-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependencies
        run: python -m pip install sympy
      - name: Check true H75 source and conditional control margins
        run: python research/bridge/h75-conditional-compilation-20261020/H75_Conditional_Control_Exact_Check.py
