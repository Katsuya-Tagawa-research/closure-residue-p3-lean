name: P9 H47 Preregistered Instrument Comparator Exact Audit

on:
  push:
    branches:
      - research/p9-h47-preregistered-instrument-calibration-discriminator-20261015
  pull_request:

permissions:
  contents: read

jobs:
  h47-preregistered-instrument-comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exact same-calibration CPTP comparator, finite-time odd flag and finite-shot bound
        run: python3 P3/P9H47PreregisteredInstrumentComparatorExactCheck.py
