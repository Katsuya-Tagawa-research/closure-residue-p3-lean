name: P3 Rational Auto Pivots CI

on:
  push:
    branches:
      - research/p3-rational-auto-pivots-20261013
  pull_request:

permissions:
  contents: read

jobs:
  rational-auto-pivots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile finite automatic rational pivot search
        run: lake build P3.RationalAutoPivots
      - name: Audit automatic rank certificates
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/RationalAutoPivotsAxiomAudit.lean | tee rational_auto_axioms.log
          if grep -q 'sorryAx' rational_auto_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
