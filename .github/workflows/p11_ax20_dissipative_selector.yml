name: P11 AX20 intrinsic dissipative observer exact audit
on:
  push:
    branches:
      - research/p11-ax20-intrinsic-dissipative-observer-20261020
    paths:
      - 'research/p11/ax20-intrinsic-dissipative-observer-20261020/**'
      - '.github/workflows/p11_ax20_dissipative_selector.yml'
  pull_request:
    paths:
      - 'research/p11/ax20-intrinsic-dissipative-observer-20261020/**'
      - '.github/workflows/p11_ax20_dissipative_selector.yml'
permissions:
  contents: read
jobs:
  exact-h37-dissipative-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/ax20-intrinsic-dissipative-observer-20261020/P11_AX20_ci_compact.py
      - name: Verify scope-gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('research/p11/ax20-intrinsic-dissipative-observer-20261020/P11_AX20_ci_compact_result.json')
          r=json.loads(f.read_text())
          assert r['exact_assertions_passed']==81
          assert r['G2']=='OPEN' and r['G3']=='OPEN'
          print('AX20 81/81 exact assertions PASS; G2/G3 OPEN')
          PY
