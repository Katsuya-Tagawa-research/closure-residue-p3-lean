name: P11 AX07 finite operational equivalence audit
on:
  pull_request:
    paths:
      - 'research/p11/ax07-generative-completeness-gate-20261019/**'
      - '.github/workflows/p11_ax07_generative_gate.yml'
  push:
    branches:
      - 'research/p11-ax07-generative-completeness-20261019'
    paths:
      - 'research/p11/ax07-generative-completeness-gate-20261019/**'
      - '.github/workflows/p11_ax07_generative_gate.yml'
permissions:
  contents: read
jobs:
  finite-operational-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/ax07-generative-completeness-gate-20261019/P11_AX07_generativity_gate_audit.py
      - name: Assert scoped finite evidence and open physical gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/p11/ax07-generative-completeness-gate-20261019/P11_AX07_exact_results.json')
          r=json.loads(p.read_text())
          assert r['all_passed'] and r['exact_checks']==99
          assert r['finite_word_equivalence_cutoff']==7
          assert r['witness_shortest_word_length']==2
          assert r['reachable_subspace_dims']==[1,3,4,4]
          assert r['declared_qubit_instrument_tomography_rank']==16
          assert r['physical_primitive_provenance']=='OPEN'
          assert r['p11_generative_completeness']=='OPEN'
          print('AX07 operational equivalence PASS; physical source G2 and F completeness G3 OPEN')
          PY
