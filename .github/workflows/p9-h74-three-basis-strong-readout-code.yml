name: P9 H74 Three-Basis Strong Readout and Restricted P3 Code Exact Audit

on:
  push:
    branches:
      - research/p9-h74-three-basis-strong-readout-reversibility-and-restricted-p3-code-20261016
  pull_request:

permissions:
  contents: read

jobs:
  h74-strong-readout-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exact three-real-basis KL rank and same-source nonzero-P3 parity qubit code
        run: python3 P3/P9H74ThreeBasisStrongReadoutRestrictedP3CodeExactCheck.py
