name: P3 Rational Rank Certificate CI

on:
  push:
    branches:
      - research/p3-rational-rank-cert-20261013
  pull_request:

permissions:
  contents: read

jobs:
  rational-rank-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile rational rank certificate checker
        run: lake build P3.RationalRankCertificate
      - name: Audit rank certificate theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/RationalRankCertificateAxiomAudit.lean | tee rational_rank_axioms.log
          if grep -q 'sorryAx' rational_rank_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
