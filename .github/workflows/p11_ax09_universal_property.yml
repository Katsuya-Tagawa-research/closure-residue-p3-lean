name: P11 AX09 universal observable realization exact audit
on:
  pull_request:
    paths:
      - 'research/p11/ax09-universal-observable-realization-20261019/**'
      - '.github/workflows/p11_ax09_universal_property.yml'
  push:
    branches:
      - 'research/p11-ax09-universal-realization-20261019'
    paths:
      - 'research/p11/ax09-universal-observable-realization-20261019/**'
      - '.github/workflows/p11_ax09_universal_property.yml'
permissions:
  contents: read
jobs:
  exact-hankel-realization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/ax09-universal-observable-realization-20261019/P11_AX09_hankel_universal_audit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/p11/ax09-universal-observable-realization-20261019/P11_AX09_exact_results.json')
          r=json.loads(p.read_text())
          assert r['all_passed'] and r['checks_passed']==203
          assert r['hankel_rank']==2
          assert r['reachable_dimension']==2 and r['observable_dimension']==2
          assert r['physical_primitive_identity']=='OPEN'
          assert r['observer_effect_origin']=='OPEN'
          assert r['P11_generative_completeness']=='OPEN'
          print('AX09 203/203 exact finite tests PASS; G2/G3 remain OPEN')
          PY
