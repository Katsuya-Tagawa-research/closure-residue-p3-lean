name: P3 Observable Three Plus One CI

on:
  push:
    branches:
      - research/p3-observable-three-plus-one-20261013
  pull_request:

permissions:
  contents: read

jobs:
  observable-three-plus-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile observable symmetric and skew decomposition
        run: lake build P3.ObservableThreePlusOne
      - name: Audit exact 3+1 observable split
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/ObservableThreePlusOneAxiomAudit.lean | tee p3_three_plus_one_axioms.log
          if grep -q 'sorryAx' p3_three_plus_one_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
