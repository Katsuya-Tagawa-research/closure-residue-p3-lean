name: P11 SPS H120 canonical Choi source exact audit
on:
  pull_request:
    paths:
      - 'research/p11/sps-h120-20261019/**'
      - '.github/workflows/p11_sps_h120.yml'
  push:
    branches:
      - 'research/p11-sps-h120-canonical-choi-source-20261019'
    paths:
      - 'research/p11/sps-h120-20261019/**'
      - '.github/workflows/p11_sps_h120.yml'
permissions:
  contents: read
jobs:
  exact-choi-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy==1.14.0
      - name: Execute H120 Choi-source audit
        run: python research/p11/sps-h120-20261019/P3P11_SPS_H120_choi_source_audit.py
      - name: Assert exact result and OPEN physics gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/p11/sps-h120-20261019/P3P11_SPS_H120_exact_results.json')
          r=json.loads(p.read_text())
          assert r['all_passed'] and r['exact_checks']==51
          assert r['dephase_intrinsic_dim']==2
          assert r['reduced_H119_intrinsic_dim']==2
          assert r['path_generator_bimodule_dim']==4
          assert r['path_finite_time_channel_bimodule_dim']==9
          assert r['path_finite_time_02_amplitude']=='-1/5'
          assert r['physical_primitive_provenance']=='OPEN'
          print('H120 51/51 exact algebra PASS; physical native provenance OPEN')
          PY
