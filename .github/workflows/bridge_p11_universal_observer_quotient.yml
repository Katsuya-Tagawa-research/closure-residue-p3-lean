name: Bridge P11 H75 Universal Observer Quotient Exact Audit

on:
  push:
    paths:
      - 'research/bridge/p11-universal-observer-quotient-20261020/**'
      - '.github/workflows/bridge_p11_universal_observer_quotient.yml'
  pull_request:
    paths:
      - 'research/bridge/p11-universal-observer-quotient-20261020/**'
      - '.github/workflows/bridge_p11_universal_observer_quotient.yml'
  workflow_dispatch:

jobs:
  universal-observer-quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy
      - name: Audit H75 quotient universal factorization and trace-normalized ranks
        run: python research/bridge/p11-universal-observer-quotient-20261020/H75_Universal_Observer_Quotient_Exact.py
