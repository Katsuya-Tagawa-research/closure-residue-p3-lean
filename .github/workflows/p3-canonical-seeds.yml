name: P3 Canonical Seeds CI

on:
  push:
    branches:
      - research/p3-canonical-diagonal-seeds-20261013
  pull_request:

permissions:
  contents: read

jobs:
  canonical-seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile canonical E_aa Krylov columns
        run: lake build P3.CanonicalSeeds
      - name: Audit canonical seed theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/CanonicalSeedsAxiomAudit.lean | tee canonical_seeds_axioms.log
          if grep -q 'sorryAx' canonical_seeds_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
