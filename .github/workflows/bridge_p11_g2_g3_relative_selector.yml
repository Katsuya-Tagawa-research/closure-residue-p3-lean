name: Bridge P11 G2 G3 Relative Access Selector Exact Audit

on:
  push:
    paths:
      - 'research/bridge/p11-g2-g3-relative-access-20261020/**'
      - '.github/workflows/bridge_p11_g2_g3_relative_selector.yml'
  pull_request:
    paths:
      - 'research/bridge/p11-g2-g3-relative-access-20261020/**'
      - '.github/workflows/bridge_p11_g2_g3_relative_selector.yml'
  workflow_dispatch:

jobs:
  finite-three-world-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational mathematics dependency
        run: python -m pip install sympy
      - name: Independently verify source-identical H75 ranks and selector-bit bound
        run: python research/bridge/p11-g2-g3-relative-access-20261020/H75_G2_G3_Selector_Exact.py
