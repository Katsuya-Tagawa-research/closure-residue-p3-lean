name: Unnumbered H82 Uniform History-Tail Exact Audit

on:
  push:
    paths:
      - 'research/bridge/uniform-history-tail-20261020/**'
      - '.github/workflows/audit_uniform_history_tail.yml'
  workflow_dispatch:

jobs:
  uniform-history-tail-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic library
        run: python -m pip install sympy
      - name: Check OA-G39 through OA-G42 finite regression witnesses
        run: python research/bridge/uniform-history-tail-20261020/uniform_history_tail_exact.py
