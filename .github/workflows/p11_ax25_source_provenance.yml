name: P11 AX25 independent source provenance exact audit
on:
  push:
    branches:
      - research/p11-ax25-independent-collision-provenance-20261020
    paths:
      - 'research/p11/ax25-independent-collision-provenance-20261020/**'
      - '.github/workflows/p11_ax25_source_provenance.yml'
  pull_request:
    paths:
      - 'research/p11/ax25-independent-collision-provenance-20261020/**'
      - '.github/workflows/p11_ax25_source_provenance.yml'
permissions:
  contents: read
jobs:
  exact-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/ax25-independent-collision-provenance-20261020/P11_AX25_source_provenance_audit.py
      - name: Validate explicitly open origin gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/p11/ax25-independent-collision-provenance-20261020/P11_AX25_exact_results.json').read_text())
          assert x['all_passed'] and x['exact_checks']==674
          assert x['H37_minimal_pure_bath_dimension']==5
          assert x['same_fixed_bath_input_distinct_full_unitaries']
          assert x['positive_rate_uniquely_selected_by_symmetry'] is False
          assert x['G2_physical_environment_provenance']=='OPEN'
          assert x['G3_non_circular_F_source_choice']=='OPEN'
          print('AX25 674 exact finite assertions PASS; G2/G3 OPEN')
          PY
