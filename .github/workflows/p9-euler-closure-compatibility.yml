name: P9 Euler Closure Compatibility CI

on:
  push:
    branches:
      - research/p9-euler-krylov-compatibility-20261014
  pull_request:

permissions:
  contents: read

jobs:
  euler-closure-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile exact Euler shift Krylov closure theorem
        run: lake build P3.P9EulerClosureCompatibility
      - name: Audit finite Euler compatibility
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/P9EulerClosureCompatibilityAxiomAudit.lean | tee p9_euler_closure_axioms.log
          if grep -q 'sorryAx' p9_euler_closure_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
