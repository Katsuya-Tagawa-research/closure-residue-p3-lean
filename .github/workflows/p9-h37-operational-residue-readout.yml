name: P9 H37 Operational Residue Readout Exact Audit

on:
  push:
    branches:
      - research/p9-h37-operational-residue-readout-gate-20261014
  pull_request:

permissions:
  contents: read

jobs:
  h37-residue-readout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify population nonidentifiability, coherent X/Y tomography and residue error bounds
        run: python3 P3/P9H37OperationalResidueReadoutExactCheck.py
