name: P11 SPS H119 exact finite audit
on:
  pull_request:
    paths:
      - 'research/p11/sps-h119-20261019/**'
      - '.github/workflows/p11_sps_h119.yml'
  push:
    branches:
      - 'research/p11-sps-h119-intrinsic-primitive-origin-20261019'
    paths:
      - 'research/p11/sps-h119-20261019/**'
      - '.github/workflows/p11_sps_h119.yml'
permissions:
  contents: read
jobs:
  symbolic-h119:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/sps-h119-20261019/P3P11_SPS_H119_intrinsic_source_audit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/p11/sps-h119-20261019/P3P11_SPS_H119_exact_results.json")
          r=json.loads(p.read_text())
          assert r["all_passed"] and r["checks_passed"]==31
          assert r["H37_native_real_dim"]==4 and r["H37_phase_real_dim"]==8
          assert r["joint_support_union_dim_C"]==8
          print("SPS-H119 31 exact checks PASS. Physical provenance OPEN.")
          PY
