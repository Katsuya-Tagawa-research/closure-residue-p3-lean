name: P11 AX05 operational observer accessibility exact audit
on:
  pull_request:
    paths:
      - 'research/p11/ax05-operational-accessibility-20261019/**'
      - '.github/workflows/p11_ax05_operational_accessibility.yml'
  push:
    branches:
      - 'research/p11-ax05-operational-accessibility-20261019'
    paths:
      - 'research/p11/ax05-operational-accessibility-20261019/**'
      - '.github/workflows/p11_ax05_operational_accessibility.yml'
permissions:
  contents: read
jobs:
  exact-operational-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/ax05-operational-accessibility-20261019/P11_AX05_operational_accessibility_audit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/p11/ax05-operational-accessibility-20261019/P11_AX05_exact_results.json')
          r=json.loads(p.read_text())
          assert r['all_passed'] and r['checks_passed']==109
          assert r['qubit_operational_dimension']==3 and r['qubit_generated_star_algebra_dimension']==4
          assert r['qubit_X_Z_two_detector_operational_dimension']==4
          assert r['H37_population_generator_Krylov_ranks']==[5,9,13,17,21,23,25,25]
          assert r['H37_ideal_time_resolved_effect_dimension']==25
          assert r['hardware_measurement_instruments']=='NOT CERTIFIED'
          assert r['P6_native_phase_and_readout']=='OPEN'
          assert r['P11_generative_completeness']=='OPEN'
          print('P11 AX05 exact algebra PASS; physical instrument source OPEN')
          PY
