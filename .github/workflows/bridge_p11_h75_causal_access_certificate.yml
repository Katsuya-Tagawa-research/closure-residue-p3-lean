name: Bridge P11 H75 Causal Access Certificate Joint Uniform Tail

on:
  push:
    paths:
      - 'research/bridge/p11-causal-access-certificate-20261020/**'
      - '.github/workflows/bridge_p11_h75_causal_access_certificate.yml'
  pull_request:
    paths:
      - 'research/bridge/p11-causal-access-certificate-20261020/**'
      - '.github/workflows/bridge_p11_h75_causal_access_certificate.yml'
  workflow_dispatch:

jobs:
  h75-causal-access-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic mathematics dependency
        run: python -m pip install sympy
      - name: Recheck finite adaptive causal predictive closure inherited from PR182
        run: python research/bridge/p11-adaptive-history-closure-tail-20261020/H75_Adaptive_Causal_History_Closure_Exact.py
      - name: Check new common A/B switching CP no-event tail certificate
        run: python research/bridge/p11-causal-access-certificate-20261020/H75_Causal_Access_Certificate_Switching_Exact.py
