name: Bridge P11 H75 Adaptive Causal History and CP Tail Exact Audit

on:
  push:
    paths:
      - 'research/bridge/p11-adaptive-history-closure-tail-20261020/**'
      - '.github/workflows/bridge_p11_h75_adaptive_history_tail.yml'
  pull_request:
    paths:
      - 'research/bridge/p11-adaptive-history-closure-tail-20261020/**'
      - '.github/workflows/bridge_p11_h75_adaptive_history_tail.yml'
  workflow_dispatch:

jobs:
  h75-adaptive-history-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact mathematics dependency
        run: python -m pip install sympy
      - name: Verify exact H75 adaptive closure, source-tail contraction and schedule no-go
        run: python research/bridge/p11-adaptive-history-closure-tail-20261020/H75_Adaptive_Causal_History_Closure_Exact.py
