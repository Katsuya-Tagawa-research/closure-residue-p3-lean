name: P3 Rational Rank Factorization CI

on:
  push:
    branches:
      - research/p3-universal-rank-factor-20261013
  pull_request:

permissions:
  contents: read

jobs:
  rational-rank-factorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile universal rational rank factorization
        run: lake build P3.RationalRankFactorization
      - name: Audit universal rank factorization axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/RationalRankFactorizationAxiomAudit.lean | tee rank_factor_axioms.log
          if grep -q 'sorryAx' rank_factor_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
