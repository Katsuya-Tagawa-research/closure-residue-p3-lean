name: P3 SupportDepth Lean CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  support-depth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile support-depth module
        run: lake build P3.SupportDepth
      - name: Inspect axioms for support-depth theorems
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/SupportDepthAxiomAudit.lean | tee support_depth_axioms.log
          if grep -q 'sorryAx' support_depth_axioms.log; then
            echo 'FAILED: sorryAx in theorem dependencies'
            exit 1
          fi
