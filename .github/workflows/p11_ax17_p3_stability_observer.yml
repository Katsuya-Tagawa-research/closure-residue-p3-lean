name: P11 AX17 genuine P3 perturbation and observer audit
on:
  pull_request:
    paths:
      - 'research/p11/ax17-p3-stability-observer-20261019/**'
      - '.github/workflows/p11_ax17_p3_stability_observer.yml'
  push:
    branches:
      - 'research/p11-ax17-p3-stability-observer-20261019'
    paths:
      - 'research/p11/ax17-p3-stability-observer-20261019/**'
      - '.github/workflows/p11_ax17_p3_stability_observer.yml'
permissions:
  contents: read
jobs:
  exact-p3-stability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.14.0
      - run: python research/p11/ax17-p3-stability-observer-20261019/P11_AX17_p3_perturbation_observer_audit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/p11/ax17-p3-stability-observer-20261019/P11_AX17_exact_results.json')
          r=json.loads(p.read_text())
          assert r['all_passed'] and r['checks_passed']==111
          assert r['qubit_Z_observer_first_P3_residue_depth']==3
          assert r['qubit_N_observer_P3_residue_all_depths_zero']
          assert r['H37_rotated_observer_resolvent_R2_rank']==4
          assert r['F_Generative_Completeness']=='OPEN'
          assert r['uniform_epsilon_for_all_parameter_perturbations']=='NOT CLAIMED'
          print('AX17 111 exact checks PASS; physical observer and F source OPEN')
          PY
