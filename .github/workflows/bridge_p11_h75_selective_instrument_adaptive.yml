name: Bridge P11 H75 Selective Instrument and Adaptive Feedback Exact Audit

on:
  push:
    paths:
      - 'research/bridge/p11-selective-instrument-adaptive-20261020/**'
      - '.github/workflows/bridge_p11_h75_selective_instrument_adaptive.yml'
  pull_request:
    paths:
      - 'research/bridge/p11-selective-instrument-adaptive-20261020/**'
      - '.github/workflows/bridge_p11_h75_selective_instrument_adaptive.yml'
  workflow_dispatch:

jobs:
  h75-selective-instrument-adaptive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy
      - name: Verify same nonselective CPTP with different selective feedback responses
        run: python research/bridge/p11-selective-instrument-adaptive-20261020/H75_Selective_Instrument_Adaptive_Exact.py
