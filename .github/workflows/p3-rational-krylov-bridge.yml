name: P3 Rational Krylov Bridge CI

on:
  push:
    branches:
      - research/p3-rational-krylov-bridge-20261013
  pull_request:

permissions:
  contents: read

jobs:
  rational-krylov-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile conditional rational Krylov bridge
        run: lake build P3.RationalKrylovBridge
      - name: Audit rational Krylov bridge theorems
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/RationalKrylovBridgeAxiomAudit.lean | tee rational_krylov_axioms.log
          if grep -q 'sorryAx' rational_krylov_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
