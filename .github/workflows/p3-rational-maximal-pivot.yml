name: P3 Rational Maximal Pivot CI

on:
  push:
    branches:
      - research/p3-maximal-pivot-20261013
  pull_request:

permissions:
  contents: read

jobs:
  rational-maximal-pivot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile maximal nonzero pivot and rank completeness
        run: lake build P3.RationalMaximalPivot
      - name: Audit maximal pivot and rank completeness
        shell: bash
        run: |
          set -o pipefail
          lake env lean P3/RationalMaximalPivotAxiomAudit.lean | tee maximal_pivot_axioms.log
          if grep -q 'sorryAx' maximal_pivot_axioms.log; then
            echo 'FAILED: sorryAx in dependencies'
            exit 1
          fi
