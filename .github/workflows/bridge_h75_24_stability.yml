name: Bridge H75 24-Record Stability Exact Audit

on:
  push:
    paths:
      - 'research/bridge/h75-24-stability-20261020/**'
      - '.github/workflows/bridge_h75_24_stability.yml'
  pull_request:
    paths:
      - 'research/bridge/h75-24-stability-20261020/**'
      - '.github/workflows/bridge_h75_24_stability.yml'
  workflow_dispatch:

jobs:
  exact-h75-24-record-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy numpy
      - name: Verify genuine H75 24-record exact LDL certificates
        run: python research/bridge/h75-24-stability-20261020/H75_24_Record_Stability_Exact.py
